<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Rounded Charcoal Background -->
  <rect width="512" height="512" rx="128" fill="#111210"/>

  <!-- Subtle Outer Border -->
  <rect x="10" y="10" width="492" height="492" rx="118" stroke="#F2F0E8" stroke-opacity="0.18" stroke-width="8" fill="none"/>

  <!-- Signature SCETATHON Arc Ring (Lime #D8FF50) -->
  <path d="M 350.6 120.8 A 165 165 0 1 1 405.5 325.7" stroke="#D8FF50" stroke-width="38" stroke-linecap="round" fill="none"/>

  <!-- Coral Signal Dot (#FF7358) in Ring Opening -->
  <circle cx="372" cy="140" r="24" fill="#FF7358"/>

  <!-- Central 'S' Lettermark (Ivory #F2F0E8) -->
  <text x="256" y="328" font-family="'Archivo Black', 'Arial Black', Impact, -apple-system, system-ui, sans-serif" font-size="210" font-weight="900" fill="#F2F0E8" text-anchor="middle">S</text>
</svg>
